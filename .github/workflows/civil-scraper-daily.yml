name: Civil Scraper Every 2 Hours

on:
  schedule:
    # every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Run Civil Scraper
        run: |
          curl -sS -X POST "${{ secrets.SITE_URL }}/api/civil-scraper" \
            -H "Content-Type: application/json" \
            -H "x-owner-key: ${{ secrets.OWNER_KEY }}" \
            -d "{}"
