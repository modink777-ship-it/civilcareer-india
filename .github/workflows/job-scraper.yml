name: Civil job discovery (every 2 hours)

# CivilCareer's discovery model: pull civil-engineering vacancies for India
# from job platforms (LinkedIn/Naukri/Indeed-class searches, Google Jobs,
# Adzuna, The Muse, India job feeds, Google/Bing news vacancy adverts) AND
# directly from the career pages of ~35 top Indian construction, EPC,
# infrastructure and real-estate companies.
#
# Every run writes only UNPUBLISHED drafts. Nothing reaches the public site
# until the owner reviews it in Admin → Discovery and publishes it.
#
# The script talks to GET /api/jobs?discovery=cron, which authorizes with
# either the CRON_SECRET bearer token OR the owner key (x-owner-key) — so at
# least one of those two repository secrets must be set.
#
# This workflow runs every 2 hours. Vercel's own cron is kept as a once-a-day
# safety net because Vercel limits sub-daily schedules to paid plans, and
# GitHub's scheduler can be delayed or disabled after 60 days of repository
# inactivity.

on:
  schedule:
    - cron: '0 */2 * * *'   # 00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC
  workflow_dispatch:         # manual trigger from the Actions tab

concurrency:
  group: civil-job-discovery
  cancel-in-progress: false   # never abandon a run halfway

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preflight — confirm the trigger configuration
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://civilcareer-india-two.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
        run: |
          echo "SITE_URL: ${SITE_URL}"
          if [ -z "${CRON_SECRET}" ] && [ -z "${OWNER_KEY}" ]; then
            echo "::error::Neither CRON_SECRET nor OWNER_KEY is set, so /api/jobs?discovery=cron will reject the run with HTTP 401."
            echo "::error::Add one of them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -n "${CRON_SECRET}" ]; then
            echo "Trigger credential: CRON_SECRET"
          else
            echo "Trigger credential: OWNER_KEY"
          fi

      - name: Run civil-only India discovery
        run: node scripts/scrape-jobs.js
        env:
          # Deployment origin that hosts /api/jobs
          SITE_URL: ${{ secrets.SITE_URL || 'https://civilcareer-india-two.vercel.app' }}
          # Trigger credential — CRON_SECRET is preferred
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          # Optional 4-hourly summary (sent only when drafts were found)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || 'unused' }}

      - name: Summary
        if: always()
        run: |
          echo "### Civil job discovery run" >> "$GITHUB_STEP_SUMMARY"
          echo "Time: $(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "Drafts are waiting in Admin → Discovery for review." >> "$GITHUB_STEP_SUMMARY"
