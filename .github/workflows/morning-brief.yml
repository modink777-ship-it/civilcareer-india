name: Morning Brief

on:
  schedule:
    # 01:30 UTC = 07:00 IST — daily
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Morning Brief
        run: |
          curl -sS -X POST "${{ secrets.SITE_URL }}/api/morning-brief" \
            -H "Content-Type: application/json" \
            -H "x-owner-key: ${{ secrets.OWNER_KEY }}" \
            -d "{\"key\":\"${{ secrets.OWNER_KEY }}\",\"force\":false}"
