name: Government Civil Pipeline

# Dedicated government crawler: fetches OFFICIAL recruitment sources
# (config/govt-sources.json), classifies civil posts and stages every
# candidate into govt_job_staging. NOTHING is auto-published — every
# item waits for explicit human approval in the admin Government Jobs
# section. Runs alongside the /api/govt-discovery agent-reach scans.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: govt-pipeline
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          node-version-file: .nvmrc

      - name: Crawl the aggregator feeds into the review queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: one Telegram digest per run, and only when genuinely new
          # civil postings were staged (a re-crawl of the same rows stays
          # quiet). Unset values simply skip the alert.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://civilcareer-india-two.vercel.app' }}
        run: node scripts/crawl-govt-pipeline.js

      - name: Summary
        if: always()
        run: |
          echo "### Government Civil Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "Staged items await human review in /admin → Government Jobs." >> "$GITHUB_STEP_SUMMARY"
          echo "Each run reads the six engineering aggregator feeds listed in config/govt-sources.json." >> "$GITHUB_STEP_SUMMARY"
