name: Private Supabase Backup

on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export key tables
        env:
          SUPA_URL: ${{ secrets.CIVILCAREER_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.CIVILCAREER_SUPABASE_SERVICE_KEY }}
          BACKUP_OUTPUT: backup-output
        run: |
          SUPABASE_URL="$SUPA_URL" SUPABASE_SERVICE_ROLE_KEY="$SUPA_KEY" node scripts/export-key-tables.js
      - name: Archive private backup
        uses: actions/upload-artifact@v4
        with:
          name: civilcareer-supabase-backup-${{ github.run_number }}
          path: backup-output/
          retention-days: 7
