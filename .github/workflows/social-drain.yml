name: Social Engine Drain

on:
  schedule:
    # Every 15 minutes — Vercel Hobby crons are limited to once per day,
    # so the queue drain runs here instead (see docs/00-gap-report.md F10).
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Drain the social publish queue
        run: |
          curl -sS -X POST "${{ secrets.SITE_URL }}/api/social?op=drain" \
            -H "Authorization: Bearer ${{ secrets.SOCIAL_CRON_SECRET || secrets.OWNER_KEY }}"
