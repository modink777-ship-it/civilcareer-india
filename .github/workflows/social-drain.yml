name: Social Engine Drain

on:
  schedule:
    # Phase 2 scheduler: GitHub Actions is used because Vercel Hobby
    # supports at most daily Cron runs. 30 minutes is conservative for free usage.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Drain the social publish queue
        run: |
          test -n "${{ secrets.SITE_URL }}" || { echo "SITE_URL secret is missing"; exit 1; }
          test -n "${{ secrets.SOCIAL_CRON_SECRET }}" || { echo "SOCIAL_CRON_SECRET secret is missing"; exit 1; }
          curl -fsS -X POST "${{ secrets.SITE_URL }}/api/social?op=drain" \
            -H "Authorization: Bearer ${{ secrets.SOCIAL_CRON_SECRET }}"
