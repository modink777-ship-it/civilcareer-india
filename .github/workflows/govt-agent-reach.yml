name: Government Agent Reach

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Government Agent Reach — scan
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
        run: |
          echo "Run time: $(date -u '+%Y-%m-%d %H:%M') UTC"
          echo "Results remain unpublished until Admin review."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${SITE_URL}/api/govt-discovery" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OWNER_KEY}" \
            -d "{\"key\":\"${OWNER_KEY}\"}" \
            --max-time 55)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::API returned HTTP $HTTP_CODE"
            echo "::error::Body: $BODY"
            exit 1
          fi

          echo "Government discovery completed successfully."
