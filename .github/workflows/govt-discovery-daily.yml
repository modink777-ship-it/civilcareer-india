name: Civil job discovery (every 2 hours)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Civil job discovery run
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
        run: |
          echo "Civil job discovery run"
          echo "Time: $(date -u '+%Y-%m-%d %H:%M') UTC"
          echo "Drafts are waiting in Admin → Discovery for review."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${SITE_URL}/api/civil-scraper" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"${OWNER_KEY}\"}" \
            --max-time 55)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::API returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Discovery completed."
