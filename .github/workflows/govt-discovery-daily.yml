name: Govt Discovery Every 2 Hours

on:
  schedule:
    # every 2 hours (21:00 UTC = 02:30 IST)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Government Discovery Scan
        run: |
          # /api/govt-discovery requires the CRON_SECRET bearer token
          # (the Vercel cron credential) — the owner key is not accepted
          # on this route since the admin-auth rework.
          curl -sS -X POST "${{ secrets.SITE_URL }}/api/govt-discovery" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d "{}"
