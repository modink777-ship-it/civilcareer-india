<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civil Engineering Career Blog — Exam Prep, Salary, Jobs | CivilCareer</title>
<meta name="description" content="Expert guides on SSC JE, GATE Civil, RRB JE preparation, civil engineering salary, career growth and government job tips for civil engineers in India.">
<link rel="canonical" href="https://civilcareer.in/blog">
<link rel="stylesheet" href="/styles.css">
<style>
.blog-hero{background:var(--navy);padding:48px 0 32px;text-align:center}
.blog-hero h1{font-size:clamp(1.5rem,4vw,2rem);color:#fff;margin:0 0 8px}
.blog-hero p{color:#6a8aaa;font-size:.9rem}
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}
.cat-tab{padding:6px 16px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s}
.cat-tab.active,.cat-tab:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:8px 0 48px}
.blog-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;color:inherit;display:block;transition:all .15s}
.blog-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.blog-card-body{padding:20px}
.blog-cat{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin-bottom:8px}
.blog-card h2{font-size:.95rem;font-weight:700;color:var(--navy);margin:0 0 8px;line-height:1.4}
.blog-card p{font-size:.82rem;color:var(--text);margin:0 0 14px;line-height:1.5}
.blog-meta{font-size:.72rem;color:var(--muted);display:flex;gap:12px}
.loading-state{text-align:center;padding:48px;color:var(--muted)}
</style>
</head>
<body>
<div id="mainHeader"></div>

<div class="blog-hero">
  <div class="container">
    <h1>Civil Engineering Career Blog</h1>
    <p>Expert guides on exams, salary, career growth and government jobs for civil engineers in India</p>
  </div>
</div>

<div class="container">
  <div class="cat-tabs">
    <button class="cat-tab active" onclick="loadPosts('')" data-cat="">All</button>
    <button class="cat-tab" onclick="loadPosts('exam-prep')" data-cat="exam-prep">Exam Prep</button>
    <button class="cat-tab" onclick="loadPosts('salary')" data-cat="salary">Salary Guide</button>
    <button class="cat-tab" onclick="loadPosts('career')" data-cat="career">Career</button>
    <button class="cat-tab" onclick="loadPosts('companies')" data-cat="companies">Companies</button>
    <button class="cat-tab" onclick="loadPosts('govt')" data-cat="govt">Govt Jobs</button>
  </div>

  <div id="blogGrid" class="blog-grid">
    <div class="loading-state">Loading articles…</div>
  </div>
  <div id="blogPager" style="text-align:center;padding-bottom:32px"></div>
</div>

<div id="mainFooter"></div>

<script>
let currentPage = 1;
const CAT_LABELS = { 'exam-prep':'Exam Prep', salary:'Salary', career:'Career', companies:'Companies', govt:'Govt Jobs' };

async function loadPosts(cat, page) {
  currentPage = page || 1;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  document.getElementById('blogGrid').innerHTML = '<div class="loading-state">Loading…</div>';
  try {
    const r = await fetch(`/api/blog?page=${currentPage}${cat ? '&category='+cat : ''}`);
    const d = await r.json();
    if (!d.posts || !d.posts.length) {
      document.getElementById('blogGrid').innerHTML = '<div class="loading-state">No articles yet in this category. Check back soon!</div>';
      return;
    }
    document.getElementById('blogGrid').innerHTML = d.posts.map(p => {
      const date = p.published_at ? new Date(p.published_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
      const catLabel = CAT_LABELS[p.category] || p.category || '';
      return `<a class="blog-card" href="/blog/${p.slug}">
        <div class="blog-card-body">
          <div class="blog-cat">${catLabel}</div>
          <h2>${esc(p.title)}</h2>
          <p>${esc(p.meta_description || '')}</p>
          <div class="blog-meta"><span>📅 ${date}</span>${p.views ? `<span>👁 ${p.views} views</span>` : ''}</div>
        </div>
      </a>`;
    }).join('');

    const pages = Math.ceil(d.total / d.limit);
    document.getElementById('blogPager').innerHTML = pages > 1
      ? `<button class="btn-ghost" ${currentPage<=1?'disabled':''} onclick="loadPosts('${cat}',${currentPage-1})">← Prev</button>
         <span style="color:var(--muted);font-size:.82rem;margin:0 12px">Page ${currentPage} of ${pages}</span>
         <button class="btn-ghost" ${currentPage>=pages?'disabled':''} onclick="loadPosts('${cat}',${currentPage+1})">Next →</button>`
      : '';
  } catch(e) {
    document.getElementById('blogGrid').innerHTML = '<div class="loading-state">Could not load articles.</div>';
  }
}

function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadPosts('');
</script>
</body>
</html>
