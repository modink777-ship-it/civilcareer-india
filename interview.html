<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civil Engineering Interview Questions — L&T, AECOM, NCC, Govt | CivilCareer</title>
<meta name="description" content="Real civil engineering interview questions from L&T Construction, AECOM, NCC, CPWD, SSC JE interviews. Technical, HR and management round questions with answers.">
<link rel="canonical" href="https://civilcareer.in/interview">
<link rel="stylesheet" href="/styles.css">
<style>
.iv-hero{background:var(--navy);padding:48px 0 32px;text-align:center}
.iv-hero h1{font-size:clamp(1.4rem,4vw,2rem);color:#fff;margin:0 0 8px}
.iv-hero p{color:#6a8aaa;font-size:.9rem}
.companies-row{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.co-chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s}
.co-chip.active,.co-chip:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.iv-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.iv-filters select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:.82rem;background:#fff;color:var(--navy)}
.q-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.q-card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.q-company{font-size:.72rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.q-meta{font-size:.72rem;color:var(--muted);display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.q-text{font-size:.92rem;color:var(--navy);font-weight:500;line-height:1.5;margin-bottom:10px}
.q-answer{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:.83rem;color:var(--text);line-height:1.6;display:none}
.q-answer.show{display:block}
.q-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.upvote-btn{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:.75rem;cursor:pointer;color:var(--muted);transition:all .15s}
.upvote-btn:hover{border-color:var(--blue);color:var(--blue)}
.upvote-btn.voted{background:var(--blue);color:#fff;border-color:var(--blue)}
.diff-badge{font-size:.65rem;padding:2px 8px;border-radius:99px;font-weight:700}
.diff-easy{background:#d1fae5;color:#065f46}
.diff-medium{background:#fef3c7;color:#92400e}
.diff-hard{background:#fee2e2;color:#991b1b}
.round-badge{font-size:.65rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--text);font-weight:600}
.submit-form{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:32px 0}
.submit-form h3{color:var(--navy);margin:0 0 16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="mainHeader"></div>

<div class="iv-hero">
  <div class="container">
    <h1>Civil Engineering Interview Questions</h1>
    <p>Real questions from L&T, AECOM, NCC, CPWD, SSC JE interviews — shared by civil engineers</p>
  </div>
</div>

<div class="container" style="padding-top:24px">

  <div class="companies-row" id="companyChips">
    <button class="co-chip active" onclick="filterCompany('')" data-co="">All Companies</button>
    <button class="co-chip" onclick="filterCompany('L&T Construction')" data-co="L&T Construction">L&T Construction</button>
    <button class="co-chip" onclick="filterCompany('AECOM India')" data-co="AECOM India">AECOM India</button>
    <button class="co-chip" onclick="filterCompany('NCC Limited')" data-co="NCC Limited">NCC Limited</button>
    <button class="co-chip" onclick="filterCompany('Shapoorji Pallonji')" data-co="Shapoorji Pallonji">Shapoorji Pallonji</button>
    <button class="co-chip" onclick="filterCompany('CPWD')" data-co="CPWD">CPWD</button>
    <button class="co-chip" onclick="filterCompany('NTPC')" data-co="NTPC">NTPC</button>
    <button class="co-chip" onclick="filterCompany('RITES')" data-co="RITES">RITES</button>
  </div>

  <div class="iv-filters">
    <select id="roundFilter" onchange="loadQ()">
      <option value="">All Rounds</option>
      <option value="Technical">Technical</option>
      <option value="HR">HR</option>
      <option value="Manager">Manager</option>
    </select>
    <select id="diffFilter" onchange="loadQ()">
      <option value="">All Levels</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <div id="qList"><div style="text-align:center;padding:32px;color:var(--muted)">Loading questions…</div></div>
  <div id="qPager" style="text-align:center;margin:16px 0"></div>

  <!-- Submit form -->
  <div class="submit-form">
    <h3>📝 Share Your Interview Experience</h3>
    <p style="color:var(--muted);font-size:.83rem;margin:0 0 16px">Help fellow civil engineers prepare. All submissions reviewed before publishing.</p>
    <div class="form-row">
      <div><label style="font-size:.8rem;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Company *</label>
        <input id="fCompany" placeholder="e.g. L&T Construction" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;box-sizing:border-box"></div>
      <div><label style="font-size:.8rem;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Role</label>
        <input id="fRole" placeholder="e.g. Site Engineer" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;box-sizing:border-box"></div>
    </div>
    <label style="font-size:.8rem;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Interview Question *</label>
    <textarea id="fQuestion" rows="3" placeholder="What question were you asked?" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;box-sizing:border-box;margin-bottom:10px"></textarea>
    <label style="font-size:.8rem;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Answer / Hint (optional)</label>
    <textarea id="fAnswer" rows="2" placeholder="Share the expected answer or a helpful hint" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;box-sizing:border-box;margin-bottom:10px"></textarea>
    <div class="form-row">
      <div><label style="font-size:.8rem;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Round</label>
        <select id="fRound" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:.85rem">
          <option>Technical</option><option>HR</option><option>Manager</option>
        </select></div>
      <div><label style="font-size:.8rem;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Difficulty</label>
        <select id="fDiff" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:.85rem">
          <option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option>
        </select></div>
    </div>
    <button class="btn-blue" onclick="submitQ()" id="submitQBtn" style="margin-top:8px">Submit Question</button>
    <div id="submitMsg" style="display:none;margin-top:10px;font-size:.82rem;color:#065f46;background:#d1fae5;padding:10px 14px;border-radius:8px"></div>
  </div>
</div>

<div id="mainFooter"></div>

<script>
let currentCo = '', currentPage = 1;
const voted = new Set(JSON.parse(localStorage.getItem('iv_voted')||'[]'));

function filterCompany(co) {
  currentCo = co; currentPage = 1;
  document.querySelectorAll('.co-chip').forEach(b => b.classList.toggle('active', b.dataset.co === co));
  loadQ();
}

async function loadQ(page) {
  currentPage = page || 1;
  const round = document.getElementById('roundFilter').value;
  const diff  = document.getElementById('diffFilter').value;
  let url = `/api/interview?page=${currentPage}${currentCo ? '&company='+encodeURIComponent(currentCo) : ''}${round ? '&round='+round : ''}`;
  document.getElementById('qList').innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted)">Loading…</div>';
  try {
    const r = await fetch(url);
    const d = await r.json();
    const qs = d.questions || [];
    if (!qs.length) {
      document.getElementById('qList').innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted)">No questions yet for this filter. Be the first to share!</div>';
      document.getElementById('qPager').innerHTML = ''; return;
    }
    document.getElementById('qList').innerHTML = qs.filter(q => !diff || q.difficulty === diff).map(q => {
      const diffCls = {easy:'diff-easy',medium:'diff-medium',hard:'diff-hard'}[q.difficulty]||'diff-medium';
      const hasVoted = voted.has(q.id);
      return `<div class="q-card" id="qc-${q.id}">
        <div class="q-company">${esc(q.company)}</div>
        <div class="q-meta">
          ${q.role ? `<span>👔 ${esc(q.role)}</span>` : ''}
          <span class="round-badge">${esc(q.round||'Technical')}</span>
          <span class="diff-badge ${diffCls}">${q.difficulty||'medium'}</span>
          ${q.year ? `<span>📅 ${q.year}</span>` : ''}
        </div>
        <div class="q-text">${esc(q.question)}</div>
        <div class="q-actions">
          <button class="upvote-btn${hasVoted?' voted':''}" onclick="upvote('${q.id}',this)">
            👍 ${q.upvotes||0} helpful
          </button>
          ${q.answer ? `<button class="btn-ghost" style="font-size:.75rem;padding:5px 12px" onclick="toggleAns('${q.id}')">Show Answer</button>` : ''}
        </div>
        ${q.answer ? `<div class="q-answer" id="ans-${q.id}"><strong>Answer:</strong> ${esc(q.answer)}</div>` : ''}
      </div>`;
    }).join('');

    const pages = Math.ceil(d.total/d.limit);
    document.getElementById('qPager').innerHTML = pages > 1
      ? `<button class="btn-ghost" ${currentPage<=1?'disabled':''} onclick="loadQ(${currentPage-1})">← Prev</button>
         <span style="color:var(--muted);font-size:.82rem;margin:0 12px">Page ${currentPage} of ${pages} · ${d.total} questions</span>
         <button class="btn-ghost" ${currentPage>=pages?'disabled':''} onclick="loadQ(${currentPage+1})">Next →</button>`
      : `<span style="color:var(--muted);font-size:.78rem">${d.total} questions</span>`;
  } catch(e) {
    document.getElementById('qList').innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted)">Could not load questions.</div>';
  }
}

function toggleAns(id) {
  const el = document.getElementById('ans-'+id);
  el.classList.toggle('show');
}

async function upvote(id, btn) {
  if (voted.has(id)) return;
  try {
    await fetch('/api/interview?action=upvote', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
    voted.add(id);
    localStorage.setItem('iv_voted', JSON.stringify([...voted]));
    btn.classList.add('voted');
    const cur = parseInt(btn.textContent.match(/\d+/)?.[0]||0);
    btn.textContent = `👍 ${cur+1} helpful`;
  } catch {}
}

async function submitQ() {
  const company  = document.getElementById('fCompany').value.trim();
  const question = document.getElementById('fQuestion').value.trim();
  if (!company || !question) { alert('Company and question are required.'); return; }
  const btn = document.getElementById('submitQBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await fetch('/api/interview', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ company, role: document.getElementById('fRole').value, question,
        answer: document.getElementById('fAnswer').value, round: document.getElementById('fRound').value,
        difficulty: document.getElementById('fDiff').value }) });
    const d = await r.json();
    document.getElementById('submitMsg').textContent = d.message || 'Submitted! Thank you.';
    document.getElementById('submitMsg').style.display = '';
    ['fCompany','fRole','fQuestion','fAnswer'].forEach(id => document.getElementById(id).value = '');
  } catch { alert('Could not submit. Please try again.'); }
  btn.disabled = false; btn.textContent = 'Submit Question';
}

function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadQ();
</script>
</body>
</html>
